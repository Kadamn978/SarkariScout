name: Deploy

on:
  push:
    branches: [pre-dev, test, release, main]

jobs:
  ci:
    name: Run Tests
    uses: ./.github/workflows/ci.yml

  # Vercel auto-deploys via GitHub integration (no CI step needed)
  # pre-dev → preview, test → preview, main → production
  # No manual Vercel deploy steps — the GitHub-Vercel app handles it

  deploy-railway:
    name: Deploy Backend (Railway)
    needs: ci
    if: github.ref == 'refs/heads/test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        run: railway up --service rozgar-pilot-backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
