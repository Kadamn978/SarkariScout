name: CI

on:
  push:
    branches: [pre-dev, main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: testpassword
          MYSQL_DATABASE: sarkariscout_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
        env:
          NODE_ENV: development

      - run: npx prisma generate
        env:
          DATABASE_URL: mysql://root:testpassword@127.0.0.1:3306/sarkariscout_test

      - run: npx prisma db push
        env:
          DATABASE_URL: mysql://root:testpassword@127.0.0.1:3306/sarkariscout_test

      - run: npm run typecheck

      - run: npm run build

      - run: npm test -- --coverage --forceExit
        env:
          DATABASE_URL: mysql://root:testpassword@127.0.0.1:3306/sarkariscout_test
          REDIS_URL: redis://127.0.0.1:6379
          JWT_SECRET: test-secret-key-for-ci-pipeline-min-32-chars!!
          NODE_ENV: test

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/

  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        env:
          NODE_ENV: development

      - run: npm run build

      - run: npm test
        env:
          VITE_API_URL: /api
          VITE_APP_NAME: SarkariScout

  lint:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend deps
        run: npm ci
        working-directory: backend

      - name: Install frontend deps
        run: npm ci
        working-directory: frontend

      - name: Backend typecheck
        run: npm run typecheck
        working-directory: backend

      - name: Frontend build
        run: npm run build
        working-directory: frontend
