    <style>

        min-height: 100vh;
        background: #f9fafb;
        display: flex;
        align-items: center;

      #root:empty::after {
        content: '';
        width: 40px;
        height: 40px;
        border: 4px solid #e5e7eb;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-color-scheme: dark) {
        #root:empty { background: #030712; }
        #root:empty::after { border-color: #1f2937; border-top-color: #60a5fa; }
      }
