services:
  mysql:
    image: mysql:8.4
    container_name: rozgarscout-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rozgarscoutRoot2024}
      MYSQL_DATABASE: rozgarscout
      MYSQL_USER: ${MYSQL_USER:-rozgarscout}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-rozgarscoutPass2024}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: rozgarscout-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-rozgarscoutRedis2024}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-rozgarscoutRedis2024}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rozgarscout-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-rozgarscout}:${MYSQL_PASSWORD:-rozgarscoutPass2024}@mysql:3306/rozgarscout
      REDIS_URL: redis://:${REDIS_PASSWORD:-rozgarscoutRedis2024}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-rozgarscout-dev-jwt-secret-change-in-prod-2026-secure-random-string}
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:80}
      TZ: Asia/Kolkata
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  init-db:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rozgarscout-init
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-rozgarscout}:${MYSQL_PASSWORD:-rozgarscoutPass2024}@mysql:3306/rozgarscout
      REDIS_URL: redis://:${REDIS_PASSWORD:-rozgarscoutRedis2024}@redis:6379
      NODE_ENV: ${NODE_ENV:-development}
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pushing Prisma schema..."
        npx prisma db push --accept-data-loss --skip-generate
        echo "Seeding database..."
        npx prisma db seed
        echo "DB init complete!"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rozgarscout-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
