version: '3.8'

services:
  mysql:
    image: mysql:8.4
    container_name: sarkari-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-sarkariRoot2024}
      MYSQL_DATABASE: sarkariscout
      MYSQL_USER: sarkari
      MYSQL_PASSWORD: ${DB_PASSWORD:-sarkariPass2024}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sarkari-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-sarkariRedis2024}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-sarkariRedis2024}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sarkari-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://sarkari:${DB_PASSWORD:-sarkariPass2024}@mysql:3306/sarkariscout
      REDIS_URL: redis://:${REDIS_PASSWORD:-sarkariRedis2024}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-this-to-random-64-char-string}
      NODE_ENV: production
      PORT: 3000
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:5173}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sarkari-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
