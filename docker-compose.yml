services:
  mysql:
    image: mysql:8.4
    container_name: sarkari-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: sarkariRoot2024
      MYSQL_DATABASE: rozgarscout
      MYSQL_USER: sarkari
      MYSQL_PASSWORD: sarkariPass2024
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sarkari-redis
    restart: unless-stopped
    command: redis-server --requirepass sarkariRedis2024
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "sarkariRedis2024", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sarkari-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: mysql://sarkari:sarkariPass2024@mysql:3306/rozgarscout
      REDIS_URL: redis://:sarkariRedis2024@redis:6379
      JWT_SECRET: rozgarscout-dev-jwt-secret-change-in-prod-2026-secure-random-string
      NODE_ENV: development
      PORT: 3000
      ALLOWED_ORIGINS: http://localhost:5173,http://localhost:80
      TZ: Asia/Kolkata
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  init-db:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sarkari-init
    environment:
      DATABASE_URL: mysql://sarkari:sarkariPass2024@mysql:3306/rozgarscout
      REDIS_URL: redis://:sarkariRedis2024@redis:6379
      NODE_ENV: development
    depends_on:
      mysql:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pushing Prisma schema..."
        npx prisma db push --accept-data-loss --skip-generate
        echo "Seeding database..."
        npx prisma db seed
        echo "DB init complete!"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sarkari-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
  redis_data:
